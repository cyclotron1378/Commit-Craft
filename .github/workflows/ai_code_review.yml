name: GitSentry-AI Code Review & Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  code-audit:
    name: GitSentry-AI Tri-Pillar Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Academic Benchmark Suite & Unit Tests
        run: |
          python -m unittest discover tests -v
          python -m src.benchmark

      - name: Generate PR Unified Diff
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_changes.diff

      - name: Run GitSentry-AI Code Audit
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cli.py review --file pr_changes.diff --output audit_report.json --min-health-score 70 --fail-on-critical

      - name: Upload Security Audit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitsentry-audit-report
          path: |
            audit_report.json
            pr_changes.diff
